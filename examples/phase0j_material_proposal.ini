; Original design example only. Not an installer or a live configuration.
; Both sections are disabled; no referenced texture is supplied in Phase 0J.
; Targets describe future owned fixtures, not existing game content.
; Read docs/PHASE0J_MATERIAL_INTEGRATION.md before preparing an experiment.

[SHADER_REPLACEMENT_RV0J_NORMAL_ONLY]
ACTIVE = 0
MATERIALS = { material:RV0J_OWNED_NORMAL_ONLY & shader:ksPerPixelMultiMap & materialResource:txNormal }
RESOURCE_0 = txNormal
RESOURCE_FILE_0 = rv0j/normal_target_encoded_256.dds
; Keep the existing registered shader, properties and all other texture slots.
; Requires a validated non-damage normal slot, tangent basis and target encoding.
; This file does not load RV_MaterialRealism.hlsl or RV_TextureStability.hlsl.

[SHADER_REPLACEMENT_RV0J_EXISTING_PBR]
ACTIVE = 0
MATERIALS = { material:RV0J_OWNED_EXISTING_PBR & shader:fuPBR & materialResource:txNormal2 & materialResource:txEmAoMeRo }
RESOURCE_0 = txNormal2
RESOURCE_FILE_0 = rv0j/normal_target_encoded_256.dds
RESOURCE_1 = txEmAoMeRo
RESOURCE_FILE_1 = rv0j/existing_em_ao_me_with_original_rv_roughness.dds
; Conditional second experiment on an ALREADY compatible PBR fixture.
; Normal encoding must match the existing pbrFlags, including DXT5NM mode.
; Preserve the original emissive/AO/metalness channels and all unrelated slots.
; Supply target coating roughness in A, not Phase 0I mean(roughness^4).
; No conversion from a legacy shader to fuPBR is proposed by this section.
; Removing either section during a live session is not a rollback operation.
